<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>A4 Sample</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 공통/레이아웃/테마 CSS (테마만 교체해서 사용 가능) -->
    <link href="../common/base.css" rel="stylesheet" />
    <link href="../common/paper-a4.css" rel="stylesheet" />
    <!-- 기본 테마: theme-slate.css, 대체: theme-blue.css -->
    <link href="../themes/theme-slate.css" rel="stylesheet" />
    <style>
      /* A4 프레임 시각 보조용 그림자(화면에서만) */
      .page {
        box-shadow: 0 20px 60px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.2);
        border: 1px solid rgba(255,255,255,.06);
        /* 배경 이미지를 페이지에 꽉 차게 */
        background: url('../../../assets/a4/space.jpg') center / cover no-repeat;
      }
      /* 캔버스의 기본 배경(radial-gradient)을 제거해 배경 이미지가 보이게 함 */
      .canvas { background: transparent !important; }
      @media print { .page { box-shadow: none; border: none; } }
    </style>
  </head>
  <body>
    <!-- 배경 이미지는 .page CSS의 url(...) 경로만 바꾸면 됩니다. -->
    <div class="page">
      <main class="canvas">
        <div class="badge">A4 TEMPLATE</div>
        <h1 class="title">A4 포맷 디자인</h1>
        <p class="subtitle">인쇄/배포용 문서, 보고서, 전단지 등에 적합한 비율</p>

        <div class="row" style="backdrop-filter: blur(2px); background: rgba(0,0,0,.15); padding: 8px 12px; border-radius: 8px; width: fit-content;">
          <img class="logo" src="../../../assets/logo.svg" alt="logo" />
          <div class="cta">Create · Render · Publish</div>
        </div>

        <footer class="footer">@Jasujung99 · A4</footer>
      </main>
    </div>
  </body>
</html>
