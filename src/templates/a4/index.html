<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>A4 Sample</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 공통/레이아웃/테마 CSS (테마만 교체해서 사용 가능) -->
    <link href="../common/base.css" rel="stylesheet" />
    <link href="../common/paper-a4.css" rel="stylesheet" />
  <!-- 기본 테마: theme-slate.css, 대체: theme-blue.css -->
  <link href="../themes/theme-slate.css" rel="stylesheet" />
  <!-- 폰트: 한국어(Noto Serif KR), 영어(Playfair Display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* A4 프레임 시각 보조용 그림자(화면에서만) */
      .page {
        box-shadow: 0 20px 60px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.2);
        border: 1px solid rgba(255,255,255,.06);
        /* 배경 이미지를 페이지에 꽉 차게 */
        background: url('../../../assets/a4/space.jpg') center / cover no-repeat;
      }
      /* 캔버스의 기본 배경(radial-gradient)을 제거해 배경 이미지가 보이게 함 */
      .canvas { background: transparent !important; }
      @media print { .page { box-shadow: none; border: none; } }

      /* 색/타이포 설정 (pine + indigo 팔레트) */
      :root {
        --ink: #14213d;
        --accent-primary: #4338ca;
        --accent-secondary: #0d9488;
        --muted: #334155;
      }
      .wrap { max-width: 860px; margin: 0 auto; padding: 72px 72px 64px; color: var(--ink); }
      .en { font-family: "Playfair Display", serif; }
      .kr { font-family: "Noto Serif KR", serif; }

      .title { font-weight: 700; font-size: 66px; letter-spacing: 1px; margin: 0 0 12px; color: var(--accent-primary); }
      .underline { width: 168px; height: 5px; background: var(--accent-secondary); border-radius: 3px; margin: 6px 0 44px; }

      .heading { font-size: 30px; font-weight: 600; margin: 16px 0 14px; }
      .lead { font-size: 20px; line-height: 1.65; margin: 0 0 30px; color: var(--muted); }

      .points { display: grid; gap: 6px; margin: 6px 0 30px; }
      .points p { margin: 0; font-size: 18px; color: var(--muted); }
      .points .accent { color: var(--accent-secondary); font-weight: 700; }

      .note { margin: 24px 0 44px; font-size: 19px; font-weight: 500; }
      .event { margin-top: 28px; }
      .datetime { font-size: 26px; font-weight: 600; letter-spacing: .3px; color: var(--accent-primary); }
      .place { font-size: 20px; margin-top: 10px; color: var(--ink); }
    </style>
  </head>
  <body>
    <!-- 텍스트만 남기고, 배경 위 가독성을 위해 그림자 적용 -->
    <div class="page">
      <main class="canvas">
  <div class="wrap">
          <h1 class="title en">Welcoming Day!</h1>
          <div class="underline"></div>

          <div class="heading kr">삼시세톡 3주년을 맞아</div>
          <p class="lead kr">신규 회원 만남과 소통의 장을 마련했어요.</p>

          <div class="points kr">
            <p>기존 회원도 환영!</p>
            <p>신규 회원도 환영!</p>
            <p class="accent">관심 회원은 더욱 환영!</p>
          </div>

          <p class="note kr">가볍게 만나 즐거운 시간 만들어요~</p>

          <section class="event">
            <p class="datetime en">2025.11.12. 수요일 오후 7시</p>
            <p class="place kr">해움한국어에서 만나요~</p>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
